app = "tutela-online"
primary_region = "bog"  # Bogotá — cambia a "mia" (Miami) si prefieres

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Volumen para SQLite persistente — equivale al Volume /data de Railway
# Se crea con: fly volumes create data --region bog --size 1
[mounts]
  source = "data"
  destination = "/data"

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
