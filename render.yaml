# Configuración de Render (https://render.com) para TutelApp.
# Deploy: https://tutelapp.co
#
# IMPORTANTE — este archivo debe reflejar la REALIDAD del servicio:
# - El servicio corre con **Docker** (`runtime: docker`), no con el runtime
#   Python. Chromium/Playwright vienen en la imagen (ver Dockerfile); si alguien
#   re-sincroniza el Blueprint con `runtime: python`, el bot de radicación deja
#   de tener navegador y todas las radicaciones fallan.
# - Plan real: Standard (1 vCPU / 2 GB, id interno `1c-2g`), región oregon,
#   1 instancia, Persistent Disk `tutela-data` montado en /data.
# - `healthCheckPath: /health` está declarado aquí; verifica que el servicio
#   tenga el health check activo en el dashboard (reporta BD, disco y esquema).
#
# PERSISTENT DISK /data:
#   1. Service -> Disks -> "Create Persistent Disk".
#   2. Mount Path: /data  — la app crea /data/storage automáticamente
#      (_ensure_sqlite_dir) y el Dockerfile declara VOLUME ["/data"].
#   3. Si la BD es SQLite local (no Postgres), apuntar DATABASE_URL a
#      sqlite:////data/tutelas.db para que la BD también sobreviva redeploys.
#   El /health reporta "disk.writable" y el espacio libre: si no hay disco
#   montado, status queda en "degraded".
#
# ESTE ARCHIVO DECLARA DEFAULTs: las variables seteadas en el dashboard de
# Render toman precedencia sobre este archivo (verifica /health para ver las
# reales).
services:
  - type: web
    name: tutela-online
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /health
    disk:
      name: tutela-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: AI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        value: https://tutelapp.co
      - key: CORS_ORIGINS
        value: ""
      - key: WEBHOOK_AUTH_TOKEN
        sync: false
      - key: STRICT_WEBHOOK_FIRMA
        value: "true"
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_ENV
        value: "production"
      - key: TWOCAPTCHA_API_KEY
        sync: false
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SIMULATE_BOT
        value: "false"
      - key: STORAGE_DIR
        value: /data/storage
      # Retención de datos de tráfico: la purga diaria (03:00 Bogotá) mantiene
      # visitas/clics bajo control. En Supabase Free el techo es 500 MB por
      # proyecto; 90 días deja años de margen. Va aparte del switch de
      # radicación: si se pausa el bot, la limpieza sigue corriendo.
      - key: ENABLE_RETENCION
        value: "true"
      - key: RETENCION_VISITAS_DIAS
        value: "90"
      - key: RETENCION_CLICS_DIAS
        value: "90"
      - key: RETENCION_LOTE
        value: "5000"
      - key: RETENCION_MAX_POR_CORRIDA
        value: "50000"
