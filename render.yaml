# Configuración de Render (https://render.com) para TutelApp.
# Deploy: https://tutelapp.co
#
# NOTA sobre el plan:
# - El servicio se duerme tras ~15 min sin tráfico entrante.
# - Para mantenerlo despierto, un monitor externo gratuito (p. ej. UptimeRobot
#   con intervalo <= 10 min) debe hacer ping a https://tutelapp.co/health
#   y tener "Auto-Wake" (despertar con petición entrante) activo.
# - El plan gratis NO dispone de Persistent Disk: los archivos en storage/
#   se pierden en cada redeploy. PRODUCCIÓN usa plan Starter (~$7/mes) con
#   Persistent Disk montado en /data: los valores declarados aquí
#   (STORAGE_DIR=/data/storage, SIMULATE_BOT=false, ENABLE_SCHEDULER=true,
#   horario de radicación) reflejan esa configuración.
#
# PERSISTENT DISK /data (importante, en el dashboard de Render):
#   1. Service -> Disks -> "Create Persistent Disk".
#   2. Mount Path: /data  — la app ya crea /data/storage automáticamente
#      (_ensure_sqlite_dir) y el Dockerfile declara VOLUME ["/data"].
#   3. Si la BD es SQLite local (no Postgres), apuntar DATABASE_URL a
#      sqlite:////data/tutelas.db para que la BD también sobreviva redeploys.
#   El /health reporta "disk.writable" y el espacio libre: si no hay disco
#   montado, status queda en "degraded".
#
# ESTE ARCHIVO DECLARA DEFAULTs: las variables seteadas en el dashboard de
# Render toman precedencia sobre este archivo (verifica /health para ver las
# reales).
services:
  - type: web
    name: tutela-online
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: AI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        value: https://tutelapp.co
      - key: CORS_ORIGINS
        value: ""
      - key: WEBHOOK_AUTH_TOKEN
        sync: false
      - key: STRICT_WEBHOOK_FIRMA
        value: "true"
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_ENV
        value: "production"
      - key: TWOCAPTCHA_API_KEY
        sync: false
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SIMULATE_BOT
        value: "false"
      - key: STORAGE_DIR
        value: /data/storage
